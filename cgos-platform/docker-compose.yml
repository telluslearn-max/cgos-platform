services:
  cgos:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/cgos"
      OPENSEO_DEPLOYED_URL: "https://seo.nuruelectronics.com"
      OPENSEO_API_TOKEN: "${OPENSEO_API_TOKEN:-}"
      OPENSEO_INTEGRATION_STATUS: "connected"
      OPENSEO_SYNC_FREQUENCY: "daily"
    ports:
      - "3000:3000"

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: cgos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
